<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento Agrícola</title>
<link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .app {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        /* Estilos para el contenedor del logotipo centrado */
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-container img {
            max-width: 150px; /* Ajustá este ancho según el tamaño de tu logo */
            height: auto;
            display: inline-block;
        }

        h1 {
            text-align: center;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            background: #2d7d32;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .maquina {
            background: #eeeeee;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Bloque del logotipo centrado -->
    <div class="logo-container">
        <img src="agrofix.png" alt="Logotipo Mantenimiento Agrícola">
    </div>

    <h1>🚜 Mantenimiento</h1>

    <h3>Agregar máquina</h3>

    <input type="text" id="nombre" placeholder="Nombre de la máquina">

    <select id="tipo">
        <option value="Tractor">Tractor</option>
        <option value="Cosechadora">Cosechadora</option>
        <option value="Pulverizadora">Pulverizadora</option>
        <option value="Otra">Otra</option>
    </select>

    <input type="number" id="horas" placeholder="Horas de uso">

    <button onclick="agregarMaquina()">Agregar máquina</button>

    <h2>Máquinas registradas</h2>

    <div id="lista"></div>

</div>

<script>
// 1. Cargamos las máquinas guardadas al iniciar la app. Si no hay ninguna, empezamos con un array vacío.
let maquinas = JSON.parse(localStorage.getItem("agrofix_maquinas")) || [];

// 2. Ejecutamos la función para mostrar las máquinas guardadas apenas cargue la página
document.addEventListener("DOMContentLoaded", mostrarMaquinas);

function agregarMaquina() {
    let nombre = document.getElementById("nombre").value;
    let tipo = document.getElementById("tipo").value;
    let horas = document.getElementById("horas").value;

    if (nombre === "" || horas === "") {
        alert("Completá todos los campos");
        return;
    }

    // 3. Creamos un objeto para la nueva máquina con un ID único usando la fecha actual en milisegundos
    let nuevaMaquina = {
        id: Date.now(),
        nombre: nombre,
        tipo: tipo,
        horas: horas
    };

    // 4. Agregamos el objeto al array global
    maquinas.push(nuevaMaquina);

    // 5. Guardamos la lista actualizada en el localStorage del navegador
    localStorage.setItem("agrofix_maquinas", JSON.stringify(maquinas));

    // 6. Volvemos a dibujar la lista en pantalla y limpiamos el formulario
    mostrarMaquinas();

    document.getElementById("nombre").value = "";
    document.getElementById("horas").value = "";
}

// 7. Nueva función encargada exclusivamente de dibujar las máquinas en el HTML
function mostrarMaquinas() {
    let listaContenedor = document.getElementById("lista");
    listaContenedor.innerHTML = ""; // Limpiamos la pantalla antes de redibujar

    maquinas.forEach(maquina => {
        let divMaquina = document.createElement("div");
        divMaquina.className = "maquina";
        
        // El botón eliminar ahora llama a la función eliminarMaquina usando el ID único
        divMaquina.innerHTML = `
            <strong>${maquina.nombre}</strong><br>
            Tipo: ${maquina.tipo}<br>
            Horas de uso: ${maquina.horas} h<br>
            <button onclick="eliminarMaquina(${maquina.id})">
                Eliminar
            </button>
        `;
        listaContenedor.appendChild(divMaquina);
    });
}

// 8. Nueva función para borrar la máquina de la memoria
function eliminarMaquina(id) {
    // Filtramos la lista para conservar todas las máquinas menos la que coincida con el ID seleccionado
    maquinas = maquinas.filter(maquina => maquina.id !== id);

    // Actualizamos el localStorage con la nueva lista filtrada
    localStorage.setItem("agrofix_maquinas", JSON.stringify(maquinas));

    // Volvemos a renderizar en pantalla
    mostrarMaquinas();
}
</script>

</body>
</html>
